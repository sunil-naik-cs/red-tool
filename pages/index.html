<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yono SBI - Registration</title>

    <!-- FontAwesome Icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <style>

        /* ================================
           RESET
        ================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        /* ================================
           SCREEN BACKGROUND
        ================================= */

        body {
            background: linear-gradient(
                135deg,
                #4a148c 0%,
                #7b1fa2 100%
            );

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            padding: 15px;
        }


        /* ================================
           MAIN CONTAINER
        ================================= */

        .container {
            width: 100%;
            max-width: 380px;
            text-align: center;
        }


        /* ================================
            BRAND HEADER
        ================================= */

        .brand-header {

            color: #ffffff;

            font-size: 32px;
            font-weight: bold;

            letter-spacing: 3px;

            margin-bottom: 20px;

            text-transform: uppercase;

            text-shadow:
                0 2px 5px rgba(0, 0, 0, 0.3);

            display: flex;
            align-items: center;

            gap: 10px;

            text-align: left;
        }


        /* ================================
           PROFILE IMAGE
        ================================= */

        .brand-header img {

            width: 38px;
            height: 38px;

            border-radius: 50%;

            object-fit: cover;

            display: block;

            border: 2px solid #ffffff;

            box-shadow:
                0 2px 6px rgba(0, 0, 0, 0.3);
        }


        /* ================================
           REGISTRATION CARD
        ================================= */

        .card {

            background-color: #ffffff;

            padding: 30px 25px;

            border-radius: 8px;

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.3);

            text-align: center;
        }


        /* ================================
           CARD TITLE
        ================================= */

        .card h2 {

            color: #333333;

            font-size: 20px;

            font-weight: 600;
        }


        /* ================================
           PURPLE LINE
        ================================= */

        .purple-line {

            width: 70px;
            height: 3px;

            background-color: #6a1b9a;

            margin: 8px auto 15px auto;
        }


        /* ================================
           SUBTITLE
        ================================= */

        .subtitle {

            font-size: 12px;

            color: #666666;

            margin-bottom: 25px;
        }


        /* ================================
           INPUT GROUP
        ================================= */

        .input-group {

            text-align: left;

            margin-bottom: 20px;
        }


        /* ================================
           LABEL
        ================================= */

        .input-group label {

            display: block;

            font-size: 13px;

            font-weight: bold;

            color: #444444;

            margin-bottom: 6px;
        }


        /* ================================
           INPUT FIELD
        ================================= */

        .input-field {

            position: relative;

            display: flex;

            align-items: center;
        }


        /* ================================
           INPUT ICON
        ================================= */

        .input-field i {

            position: absolute;

            left: 12px;

            color: #777777;

            font-size: 14px;
        }


        /* ================================
           INPUT
        ================================= */

        .input-field input {

            width: 100%;

            padding:
                10px
                10px
                10px
                35px;

            border: 1px solid #cccccc;

            border-radius: 4px;

            font-size: 14px;

            outline: none;
        }


        /* ================================
           INPUT FOCUS
        ================================= */

        .input-field input:focus {

            border-color: #6a1b9a;
        }


        /* ================================
           REGISTER BUTTON
        ================================= */

        .register-btn {

            width: 100%;

            padding: 12px;

            background-color: #6a1b9a;

            color: white;

            border: none;

            border-radius: 4px;

            font-size: 14px;

            font-weight: bold;

            letter-spacing: 0.5px;

            cursor: pointer;

            margin-top: 10px;
        }


        /* ================================
           BUTTON HOVER
        ================================= */

        .register-btn:hover {

            background-color: #4a148c;
        }


        /* ================================
           VERSION
        ================================= */

        .version {

            display: block;

            margin-top: 25px;

            font-size: 10px;

            color: #888888;
        }


        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 400px) {

            .card {

                padding: 20px 15px;
            }

            .brand-header {

                font-size: 28px;
            }

            .brand-header img {

                width: 34px;
                height: 34px;
            }
        }

    </style>
</head>


<body>


    <div class="container">


        <!-- =================================
              BRAND + PROFILE IMAGE
        ================================= -->

        <h1 class="brand-header">

            <img
                src="sbi2.jpg"
                alt="Profile"
            >

            <span>Yono SBI</span>

        </h1>


        <!-- =================================
             REGISTRATION CARD
        ================================= -->

        <div class="card">


            <h2>
                Registration
            </h2>


            <div class="purple-line"></div>


            <p class="subtitle">
                Enter your details to proceed.
            </p>


            <!-- =================================
                 PHP BACKEND FORM
            ================================= -->

            <form
                action="register.php"
                method="POST"
            >


                <!-- USERNAME -->

                <div class="input-group">

                    <label for="username">
                        User Name
                    </label>


                    <div class="input-field">

                        <i class="fa-regular fa-user"></i>


                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter User Name"
                            required
                        >

                    </div>

                </div>



                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>


                    <div class="input-field">

                        <i class="fa-solid fa-lock"></i>


                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter Password"
                            required
                        >

                    </div>

                </div>



                <!-- REGISTER BUTTON -->

                <button
                    type="submit"
                    class="register-btn"
                >
                    REGISTER
                </button>


            </form>


            <!-- VERSION -->

            <span class="version">
                Ver 1.0.0
            </span>


        </div>


    </div>


</body>
</html>
