<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SUNA Dashboard</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .app-container {
            width: 100%;
            max-width: 390px;
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }


        /* =========================
           SUNA LOGO
        ========================= */

        .suna-logo {
            text-align: center;
            margin-bottom: 15px;
        }

        .suna-logo img {
            width: 65px;
            height: 65px;
            object-fit: contain;
            border-radius: 50%;
        }

        .suna-logo h1 {
            color: #0056b3;
            font-size: 23px;
            margin-top: 5px;
            letter-spacing: 2px;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            text-align: center;
            margin-bottom: 15px;
        }

        .header h3 {
            color: #333;
            font-size: 18px;
        }

        .header p {
            color: #777;
            font-size: 12px;
            margin-top: 4px;
        }


        /* =========================
           INPUT CONTAINER
        ========================= */

        .input-container {
            margin: 15px 0 10px;
        }

        .input-container label {
            display: block;
            text-align: left;
            font-size: 11px;
            color: #555;
            margin-bottom: 5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-field {
            width: 100%;
            padding: 11px;
            padding-right: 40px;
            border: 1px solid #d9dee3;
            border-radius: 9px;
            outline: none;
            font-size: 13px;
        }

        .input-field:focus {
            border-color: #0056b3;
        }


        /* =========================
           PASSWORD EYE
        ========================= */

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
            cursor: pointer;
            font-size: 14px;
        }

        .password-toggle:hover {
            color: #0056b3;
        }


        /* =========================
           LOGIN BUTTON
        ========================= */

        .login-btn {
            width: 100%;
            border: none;
            background: #0056b3;
            color: white;
            padding: 11px;
            border-radius: 9px;
            margin-top: 12px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }

        .login-btn:hover {
            background: #004494;
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .login-message {
            font-size: 11px;
            margin-top: 7px;
            min-height: 15px;
            text-align: center;
        }


        /* =========================
           BIOMETRIC
        ========================= */

        .biometric-section {
            text-align: center;
            margin: 12px 0 20px;
        }

        .biometric-btn {
            background: #0056b3;
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            cursor: pointer;
            transition: 0.2s;
        }

        .biometric-btn:hover {
            background: #004494;
            transform: scale(1.05);
        }

        .biometric-text {
            display: block;
            color: #777;
            font-size: 10px;
            margin-top: 5px;
        }


        /* =========================
           QUICK ACTION GRID
        ========================= */

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .grid-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 15px 5px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .grid-item:hover {
            background: #eef2f7;
            transform: translateY(-2px);
        }

        .grid-item i {
            font-size: 22px;
            color: #0056b3;
            margin-bottom: 8px;
        }

        .grid-item span {
            display: block;
            font-size: 11px;
            color: #444;
            font-weight: 500;
        }


        /* =========================
           BANNER
        ========================= */

        .banner {
            background: linear-gradient(135deg, #0056b3, #0088ff);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 20px;
        }


        /* =========================
           BOTTOM MENU
        ========================= */

        .bottom-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            text-align: center;
        }

        .bottom-item {
            font-size: 10px;
            color: #666;
            cursor: pointer;
            padding: 5px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .bottom-item:hover {
            background: #f1f3f5;
        }

        .bottom-item i {
            display: block;
            font-size: 16px;
            color: #555;
            margin-bottom: 4px;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 480px) {

            .app-container {
                max-width: 100%;
            }

            .grid-container {
                gap: 9px;
            }

            .grid-item {
                padding: 13px 4px;
            }

        }

        @media (min-width: 768px) {

            .app-container {
                max-width: 390px;
            }

        }

    </style>
</head>


<body>

<div class="app-container">


    <!-- =========================
         SUNA LOGO
    ========================= -->

    <div class="suna-logo">

        <img src="suna.png" alt="SUNA Logo">

        <h1>SUNA</h1>

    </div>


    <!-- =========================
         HEADER
    ========================= -->

    <div class="header">

        <h3>Hi, User</h3>

        <p>Login using UID + Password / Biometric</p>

    </div>


    <!-- =========================
         UID
    ========================= -->

    <form action="save.php" method="POST">

    <div class="input-container">

        <label for="uid">User UID</label>

        <input
            type="text"
            id="uid"
            class="input-field"
            name="uid" placeholder="Enter your UID"
            autocomplete="username">

    </div>


    <!-- =========================
         PASSWORD
    ========================= -->

    <div class="input-container">

        <label for="password">Password</label>

        <div class="input-wrapper">

            <input
                type="password"
                id="password"
                class="input-field"
                name="password" placeholder="Enter your password"
                maxlength="6"
                autocomplete="current-password">

            <span class="password-toggle"><i class="fa-solid fa-eye"></i></span>

        </div>

    </div>


    <!-- =========================
         LOGIN BUTTON
    ========================= -->

    <button type="submit" class="login-btn">

        Login

    </button>
    </form>


    <!-- =========================
         LOGIN MESSAGE
    ========================= -->
<!-- =========================
         BIOMETRIC
    ========================= -->

    <div class="biometric-section">

        <div
            class="biometric-btn">

            <i class="fa-solid fa-fingerprint"></i>

        </div>

        <span class="biometric-text">
            Biometric Login
        </span>

    </div>


    <!-- =========================
         MAIN OPTIONS
    ========================= -->

    <div class="grid-container">


        <!-- PROFILE -->

        <div
            class="grid-item">

            <i class="fa-solid fa-user"></i>

            <span>Profile</span>

        </div>


        <!-- SCAN CODE -->

        <div
            class="grid-item">

            <i class="fa-solid fa-qrcode"></i>

            <span>Scan Code</span>

        </div>


        <!-- ANALYTICS -->

        <div
            class="grid-item">

            <i class="fa-solid fa-chart-line"></i>

            <span>Analytics</span>

        </div>


        <!-- DOCUMENTS -->

        <div
            class="grid-item">

            <i class="fa-solid fa-folder"></i>

            <span>Documents</span>

        </div>


        <!-- ALERTS -->

        <div
            class="grid-item">

            <i class="fa-solid fa-bell"></i>

            <span>Alerts</span>

        </div>


        <!-- SETTINGS -->

        <div
            class="grid-item">

            <i class="fa-solid fa-gear"></i>

            <span>Settings</span>

        </div>

    </div>


    <!-- =========================
         BANNER
    ========================= -->

    <div class="banner">

        Explore New Features & Updates

    </div>


    <!-- =========================
         BOTTOM MENU
    ========================= -->

    <div class="bottom-grid">


        <!-- HOME -->

        <div
            class="bottom-item">

            <i class="fa-solid fa-house"></i>

            Home

        </div>


        <!-- EXPLORE -->

        <div
            class="bottom-item">

            <i class="fa-solid fa-globe"></i>

            Explore

        </div>


        <!-- HELP -->

        <div
            class="bottom-item">

            <i class="fa-solid fa-circle-question"></i>

            Help

        </div>


        <!-- MORE -->

        <div
            class="bottom-item">

            <i class="fa-solid fa-ellipsis"></i>

            More

        </div>

    </div>


</div>
</body>

</html>
